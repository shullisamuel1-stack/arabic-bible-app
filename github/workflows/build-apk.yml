name: Build Arabic Bible APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ArabicBible-Android-Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip ArabicBible-Android-Project.zip -d project

      - name: Build APK
        working-directory: project/ArabicBible
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Arabic-Bible-APK
          path: project/ArabicBible/app/build/outputs/apk/debug/*.apk
